<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>坐姿监测系统 - Posture Detection System</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- 主容器 -->
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <h1>🪑 坐姿监测系统</h1>
            <div class="status-bar">
                <div class="status-indicator" id="statusIndicator">
                    <span class="status-dot" id="statusDot"></span>
                    <span class="status-text" id="statusText">未连接</span>
                </div>
                <button class="btn-icon" id="settingsBtn" title="设置">⚙️</button>
            </div>
        </header>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 左侧：视频区域 -->
            <section class="video-section">
                <div class="video-container">
                    <!-- 隐藏的video元素用于获取摄像头流 -->
                    <video id="videoElement" autoplay playsinline style="display: none;"></video>

                    <!-- Canvas用于绘制关键点和画面 -->
                    <canvas id="canvasElement"></canvas>

                    <!-- 加载提示 -->
                    <div class="video-overlay" id="videoOverlay">
                        <div class="loading-spinner"></div>
                        <p id="overlayText">正在初始化摄像头...</p>
                    </div>
                </div>

                <!-- 控制按钮 -->
                <div class="controls">
                    <button class="btn btn-primary" id="startBtn">开始监测</button>
                    <button class="btn btn-secondary" id="stopBtn" disabled>停止监测</button>
                </div>

                <!-- 实时信息 -->
                <div class="info-panel">
                    <div class="info-item">
                        <span class="info-label">FPS:</span>
                        <span class="info-value" id="fpsValue">0</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">检测状态:</span>
                        <span class="info-value" id="detectionStatus">未检测</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">问题:</span>
                        <span class="info-value" id="issuesValue">无</span>
                    </div>
                </div>
            </section>

            <!-- 右侧：统计和历史 -->
            <aside class="sidebar">
                <!-- 实时角度显示 -->
                <div class="card">
                    <h3>实时角度</h3>
                    <div class="angles-display">
                        <div class="angle-item">
                            <span class="angle-label">头部前倾:</span>
                            <span class="angle-value" id="headAngle">--</span>
                        </div>
                        <div class="angle-item">
                            <span class="angle-label">驼背偏移:</span>
                            <span class="angle-value" id="hunchOffset">--</span>
                        </div>
                        <div class="angle-item">
                            <span class="angle-label">腿部差异:</span>
                            <span class="angle-value" id="legsDiff">--</span>
                        </div>
                    </div>
                </div>

                <!-- 今日统计 -->
                <div class="card">
                    <h3>今日统计</h3>
                    <div class="stats-display" id="todayStats">
                        <div class="stat-item">
                            <span class="stat-label">提醒次数:</span>
                            <span class="stat-value" id="alertCount">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">监测时长:</span>
                            <span class="stat-value" id="monitorTime">0分钟</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">良好时长:</span>
                            <span class="stat-value" id="goodTime">0分钟</span>
                        </div>
                    </div>
                </div>

                <!-- 历史记录 -->
                <div class="card">
                    <h3>本周统计</h3>
                    <div class="stats-display" id="weeklyStats">
                        <div class="stat-item">
                            <span class="stat-label">良好次数:</span>
                            <span class="stat-value good" id="goodCount">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">欠佳次数:</span>
                            <span class="stat-value warning" id="warningCount">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">不良次数:</span>
                            <span class="stat-value bad" id="badCount">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">总记录数:</span>
                            <span class="stat-value" id="totalRecords">0</span>
                        </div>
                    </div>
                </div>
            </aside>
        </main>
    </div>

    <!-- 设置面板（模态框） -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>⚙️ 系统设置</h2>
                <button class="btn-close" id="closeSettingsBtn">&times;</button>
            </div>
            <div class="modal-body">
                <!-- 检测阈值设置 -->
                <div class="settings-group">
                    <h3>检测阈值</h3>
                    <div class="setting-item">
                        <label for="headThreshold">头部前倾角度 (度):</label>
                        <input type="number" id="headThreshold" min="10" max="45" step="1" value="15">
                        <span class="setting-hint">低于此角度视为正常</span>
                    </div>
                    <div class="setting-item">
                        <label for="hunchThreshold">驼背偏移阈值:</label>
                        <input type="number" id="hunchThreshold" min="0.05" max="0.3" step="0.01" value="0.1">
                        <span class="setting-hint">肩膀髋部距离比例</span>
                    </div>
                    <div class="setting-item">
                        <label for="legsThreshold">跷腿差异阈值:</label>
                        <input type="number" id="legsThreshold" min="0.03" max="0.2" step="0.01" value="0.05">
                        <span class="setting-hint">左右腿位置差异</span>
                    </div>
                </div>

                <!-- 提醒设置 -->
                <div class="settings-group">
                    <h3>提醒设置</h3>
                    <div class="setting-item">
                        <label for="cooldownSeconds">冷却时间 (秒):</label>
                        <input type="number" id="cooldownSeconds" min="5" max="300" step="5" value="30">
                        <span class="setting-hint">两次提醒的最小间隔</span>
                    </div>
                    <div class="setting-item checkbox">
                        <input type="checkbox" id="enableSound" checked>
                        <label for="enableSound">启用声音提醒</label>
                    </div>
                    <div class="setting-item checkbox">
                        <input type="checkbox" id="enablePopup" checked>
                        <label for="enablePopup">启用弹窗提醒</label>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelSettingsBtn">取消</button>
                <button class="btn btn-primary" id="saveSettingsBtn">保存</button>
            </div>
        </div>
    </div>

    <!-- 提醒弹窗 -->
    <div class="alert-popup" id="alertPopup">
        <div class="alert-content">
            <div class="alert-header">
                <span class="alert-icon">⚠️</span>
                <h3 id="alertTitle">坐姿提醒</h3>
            </div>
            <div class="alert-body">
                <p id="alertMessage">检测到不良坐姿</p>
                <ul id="alertSuggestions"></ul>
            </div>
            <button class="btn btn-primary" id="closeAlertBtn">知道了</button>
        </div>
    </div>

    <!-- 引入JavaScript -->
    <script src="/static/js/app.js"></script>
</body>
</html>
