[pytest]
# 测试目录
testpaths = tests

# 异步测试配置
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# 输出配置
addopts =
    -v
    --tb=short
    --strict-markers

# Python 路径
pythonpath = .

# 标记
markers =
    asyncio: marks tests as async (deselect with '-m "not asyncio"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
